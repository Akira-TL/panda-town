<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panda Town · 15名小镇居民</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px;
      background: #f1eadb;
      color: #36513c;
      font:
        16px/1.5 "Microsoft YaHei",
        sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 32px;
    }
    p {
      margin: 0 0 24px;
      color: #70644d;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      background: #fffcf4;
      border: 1px solid #d7c79d;
      border-radius: 20px;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: 270px;
      object-fit: contain;
      padding: 8px;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #ede2c7;
      font-size: 14px;
    }
    figcaption span {
      color: #807153;
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 540px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      body {
        padding: 14px;
      }
      img {
        height: 220px;
      }
      figcaption {
        display: block;
      }
      figcaption span {
        display: block;
      }
    }
  </style>
  <h1>Panda Town · 小镇居民</h1>
  <p>15张独立角色原图 · 8位店铺角色 / 7位户外居民 · 请使用单张PNG生成模型</p>
  <div class="grid">
    <figure>
      <img src="01_bakery_rabbit.png" alt="面包师 兔子" />
      <figcaption><b>01 · 面包师</b><span>兔子</span></figcaption>
    </figure>
    <figure>
      <img src="02_grocery_beaver.png" alt="木材商 河狸" />
      <figcaption><b>02 · 木材商</b><span>河狸</span></figcaption>
    </figure>
    <figure>
      <img src="03_market_squirrel.png" alt="水果商 松鼠" />
      <figcaption><b>03 · 水果商</b><span>松鼠</span></figcaption>
    </figure>
    <figure>
      <img src="04_research_fox.png" alt="芯片店技术员 狐狸" />
      <figcaption><b>04 · 芯片店技术员</b><span>狐狸</span></figcaption>
    </figure>
    <figure>
      <img src="05_bank_owl.png" alt="金券银行职员 猫头鹰" />
      <figcaption><b>05 · 金券银行职员</b><span>猫头鹰</span></figcaption>
    </figure>
    <figure>
      <img src="06_gifts_sheep.png" alt="花店店员 绵羊" />
      <figcaption><b>06 · 花店店员</b><span>绵羊</span></figcaption>
    </figure>
    <figure>
      <img src="07_rival_otter.png" alt="咖啡豆商 水獭" />
      <figcaption><b>07 · 咖啡豆商</b><span>水獭</span></figcaption>
    </figure>
    <figure>
      <img src="08_cafe_cat.png" alt="茶馆茶师 姜黄虎斑猫" />
      <figcaption><b>08 · 茶馆茶师</b><span>姜黄虎斑猫</span></figcaption>
    </figure>
    <figure>
      <img src="09_notice_hedgehog.png" alt="公告管理员 刺猬" />
      <figcaption><b>09 · 公告管理员</b><span>刺猬</span></figcaption>
    </figure>
    <figure>
      <img src="10_repair_automaton.png" alt="修理师傅 发条机器人" />
      <figcaption><b>10 · 修理师傅</b><span>发条机器人</span></figcaption>
    </figure>
    <figure>
      <img src="11_garden_deer.png" alt="园丁 梅花鹿" />
      <figcaption><b>11 · 园丁</b><span>梅花鹿</span></figcaption>
    </figure>
    <figure>
      <img src="12_music_frog.png" alt="乐手 青蛙" />
      <figcaption><b>12 · 乐手</b><span>青蛙</span></figcaption>
    </figure>
    <figure>
      <img src="13_dock_turtle.png" alt="码头看护人 乌龟" />
      <figcaption><b>13 · 码头看护人</b><span>乌龟</span></figcaption>
    </figure>
    <figure>
      <img src="14_riverside_mouse.png" alt="河岸读者 灰鼠" />
      <figcaption><b>14 · 河岸读者</b><span>灰鼠</span></figcaption>
    </figure>
    <figure>
      <img src="15_square_dog.png" alt="小镇向导 柯基犬" />
      <figcaption><b>15 · 小镇向导</b><span>柯基犬</span></figcaption>
    </figure>
  </div>
</html>
